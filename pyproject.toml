[project]
name = "ha-id525"
version = "0.1.0"
description = "Home Assistant integration for the General Mobile ID525 5G FWA router"
readme = "README.md"
license = "MIT"
authors = [{ name = "Luca Cirillo" }]
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "id525",
    "mypy>=1.13",
    "pytest-homeassistant-custom-component==0.13.367",  # = homeassistant 2026.9.4
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.sources]
id525 = { path = "../python-id525", editable = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "ASYNC", "PL", "PT", "RET",
    "TC", "D", "N", "S", "BLE", "FBT", "ERA", "T20", "DTZ",
]
ignore = ["D203", "D213", "D105", "D107", "PLR2004", "PLR0913", "FBT001", "FBT002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "PLR", "FBT", "ARG", "TC", "PLC0415", "SLF001"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["custom_components", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["comparison-overlap"]  # entry state changes across awaits
